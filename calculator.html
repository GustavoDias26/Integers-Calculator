<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="calculator.css" rel="stylesheet">
    <script src="calculator.js" defer></script>
</head>

<body>

    <header>
        <h1>Integers calculator</h1>
    </header>

    <main>
        <section class="calculator">

            <!-- Display  -->
            <output id="display"></output>

            <!-- Buttons -->
            <div class="buttons" role="group" aria-label="Calculator buttons">
                <button type="button" class="btn btn-wide" data-action="clear">Clean</button>
                <button type="button" class="btn btn-op" data-value="/">÷</button>

                <button type="button" class="btn" data-value="7">7</button>
                <button type="button" class="btn" data-value="8">8</button>
                <button type="button" class="btn" data-value="9">9</button>
                <button type="button" class="btn btn-op" data-value="*">x</button>

                <button type="button" class="btn" data-value="4">4</button>
                <button type="button" class="btn" data-value="5">5</button>
                <button type="button" class="btn" data-value="6">6</button>
                <button type="button" class="btn btn-op" data-value="-">-</button>

                <button type="button" class="btn" data-value="1">1</button>
                <button type="button" class="btn" data-value="2">2</button>
                <button type="button" class="btn" data-value="3">3</button>
                <button type="button" class="btn btn-op" data-value="+">+</button>

                <button type="button" class="btn btn-wide" data-value="0">0</button>
                <button type="button" class="btn btn-eq" data-action="equals">=</button>
            </div>
            
        </section>
    </main>
</body>
</html>
